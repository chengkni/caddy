# 用 CI 构建出来的那个镜像跑 Caddy。
#
# 用法：
#   1. cp docker-compose.example.yml docker-compose.yml
#   2. cp Caddyfile.example Caddyfile        # 改里面的域名
#   3. 在同目录建 .env（已在 .gitignore 里，不会被提交）：
#        ALIYUN_ACCESS_KEY_ID=LTAI...
#        ALIYUN_ACCESS_KEY_SECRET=...
#   4. docker compose up -d
#
# 镜像本身是公开的，拉取不需要登录 GitHub、也不需要 docker login。

services:
  caddy:
    # 锁版本 还是 跟最新，按你要「可控」还是「省心」选：
    #
    #   caddy-2.11.7（默认）：随时知道自己在跑什么，回滚=把标签改回去。
    #     代价：上游发新版后要手动改这一行（一年约 16 次）。
    #
    #   latest：并不会自己更新！仍然要 docker compose pull 才生效，
    #     区别只是 pull 到的是「当时最新的那个」，具体版本得事后问容器：
    #         docker compose exec caddy caddy version
    #     好处是每次构建都留了 caddy-<版本> / fp-<指纹> 标签，随时可回滚。
    #
    #   想真·全自动，再加 pull_policy: always（每次 up/重启都去拉最新），
    #     代价是某次重启后行为可能就和之前不一样了。
    image: ghcr.io/chengkni/caddy:caddy-2.11.7
    container_name: caddy
    restart: unless-stopped

    ports:
      # 走 DNS-01 签证书，所以不需要开放 80/443，
      # 只暴露你真正对外提供服务的端口
      - "9080:9080"
      - "9443:9443"

    environment:
      # 从同目录的 .env 读取；写成 :? 形式，缺了就启动失败而不是静默签不到证书
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:?请在 .env 里设置}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:?请在 .env 里设置}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书都在 /data 里，这个卷千万不能丢 —— 丢了每次重启都会重新签发，
      # 很容易撞上 Let's Encrypt 的签发频率限制（每域名每周 5 次）
      - caddy_data:/data
      - caddy_config:/config

    # 如果 Caddyfile 里用 host.docker.internal 反代跑在宿主机/WSL 上的服务，
    # 就放开下面两行（Linux 上默认没有这个域名，必须显式加 host-gateway）
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:

# 改完 Caddyfile 不用重启容器，直接让它热加载：
#   docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile
# （官方镜像没有 ENTRYPOINT，所以这里要重复写一遍 caddy 子命令）
#
# 检查配置是否合法：
#   docker compose exec caddy caddy validate --config /etc/caddy/Caddyfile
