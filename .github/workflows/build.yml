name: Build custom Caddy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # 每 6 小时轮询一次上游；只有「构建指纹」变了才真正编译（见 check job）
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      caddy_version:
        description: "Caddy 版本，留空 = 上游最新 release"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 只在查上游 API 失败时兜底
  FALLBACK_CADDY_VERSION: "2.11.7"
  # 插件清单：日常只需要改这一处
  # 想锁死某个插件就写 github.com/caddy-dns/alidns@v1.0.29
  PLUGINS: "github.com/caddy-dns/alidns github.com/caddyserver/cache-handler"
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================ 版本探测
  # 轻量 job：解析目标版本、算出「构建指纹」、决定要不要真编译
  check:
    name: 探测上游版本
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
      plugins: ${{ steps.resolve.outputs.plugins }}
      build: ${{ steps.resolve.outputs.build }}
      image: ${{ steps.img.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      # GHCR 镜像名必须全小写，而 github.repository 会保留仓库名大小写。
      # 注意 env 上下文读不到 GITHUB_ENV 写的值，必须用 step output 往下传。
      - name: 计算镜像名
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: 解析版本与构建指纹
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          MANUAL_VERSION: ${{ github.event.inputs.caddy_version }}
        run: |
          set -euo pipefail

          # ---------- 1) 目标 Caddy 版本：手动指定 > 上游最新 release > 兜底 ----------
          ver="${MANUAL_VERSION}"
          if [ -z "$ver" ]; then
            ver=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name 2>/dev/null || true)
            ver="${ver#v}"
          fi
          if [ -z "$ver" ]; then
            ver="${FALLBACK_CADDY_VERSION}"
            echo "::warning::查询上游 release 失败，退回兜底版本 ${ver}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

          # ---------- 2) 解析每个插件的确切版本 ----------
          # 用 Go module proxy 的 @latest：它返回的就是 xcaddy/go 实际会拉到的版本
          # （比查 GitHub release 准，仓库没发 release 时也能拿到伪版本号）
          pinned=""
          fp="caddy=${ver}"
          for m in ${PLUGINS}; do
            if [ "${m#*@}" != "$m" ]; then
              mod="${m%@*}"; resolved="${m##*@}"
            else
              mod="$m"
              resolved=$(curl -fsSL "https://proxy.golang.org/${m}/@latest" 2>/dev/null | jq -r .Version || true)
              if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
                repo=$(printf '%s' "${m#github.com/}" | cut -d/ -f1,2)
                resolved=$(gh api "repos/${repo}/tags?per_page=1" --jq '.[0].name' 2>/dev/null || true)
              fi
              # 实在查不到就退回不锁版本，让 xcaddy 自己解析，构建仍然能成功
              if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
                echo "::warning::无法解析 ${m} 的版本，这个插件将不锁版本"
                pinned="${pinned}${mod} "
                fp="${fp};${mod}=unresolved"
                continue
              fi
            fi
            pinned="${pinned}${mod}@${resolved} "
            fp="${fp};${mod}=${resolved}"
          done
          pinned="${pinned% }"
          echo "plugins=${pinned}" >> "$GITHUB_OUTPUT"

          # Dockerfile 本身也是构建输入，改了就要重编
          fp="${fp};dockerfile=$(sha256sum Dockerfile | cut -c1-12)"
          hash=$(printf '%s' "$fp" | sha256sum | cut -c1-12)
          echo "fingerprint=${hash}" >> "$GITHUB_OUTPUT"

          {
            echo "### 构建输入"
            echo ""
            echo '```'
            echo "$fp" | tr ';' '\n'
            echo '```'
            echo ""
            echo "- 锁定后的插件列表：\`${pinned}\`"
            echo "- 指纹编号：\`fp-${hash}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # ---------- 3) 决定是否构建 ----------
          # 手动触发 / 任何 push（分支或 tag）：总是构建。
          #   指纹关卡只留给「每 6 小时的定时探测」和 PR —— 那里才是真正烧额度的地方
          #   （一年 1460 次）。日常 push 很少，拦它省不下什么，却会让人以为「推了却没反应」。
          #   连推多个提交不会堆积：concurrency 的 cancel-in-progress 会取消上一次。
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "push" ]; then
            should=true
            reason="手动触发或 push，总是构建"
          elif echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1; then
            if docker buildx imagetools inspect "${REGISTRY}/${{ steps.img.outputs.name }}:fp-${hash}" >/dev/null 2>&1; then
              should=false
              reason="指纹 fp-${hash} 已经构建过，跳过编译"
            else
              should=true
              reason="发现还没构建过的指纹，开始构建"
            fi
          else
            should=true
            reason="登录 GHCR 查询失败，保守起见选择构建"
          fi
          echo "build=${should}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 决定：构建 = \`${should}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${reason}（事件：\`${EVENT}\`）" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::${reason}"

  # ============================================================ 镜像
  image:
    name: 镜像 linux/amd64 + linux/arm64
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.check.outputs.image }}
          tags: |
            type=raw,value=caddy-${{ needs.check.outputs.version }}
            type=raw,value=fp-${{ needs.check.outputs.fingerprint }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ needs.check.outputs.version }}
            PLUGINS=${{ needs.check.outputs.plugins }}
            FINGERPRINT=${{ needs.check.outputs.fingerprint }}
          # 缓存键天然跟着版本走：PLUGINS 带精确版本 + FINGERPRINT 出现在 RUN 里，
          # 上游一发新版缓存就失效，所以这里可以放心开缓存
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================ 独立二进制
  # 静态二进制 + 镜像归档。
  # 必须等 image 跑完：归档镜像要先从 GHCR 把刚推上去的镜像拉下来。
  # 因此 image 失败时这里会被跳过、不发 Release —— 这是有意的，避免只发一半产物。
  binary:
    name: 二进制 linux/${{ matrix.goarch }}
    needs: [check, image]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # 串行跑：两个 job 都要确保 release 存在，并行会撞车
      max-parallel: 1
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      # 借用官方 builder 镜像，在 runner 本机架构上交叉编译出目标架构的二进制
      - name: 交叉编译
        env:
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.check.outputs.version }}
          PINNED: ${{ needs.check.outputs.plugins }}
        run: |
          set -eux
          mkdir -p dist
          docker run --rm \
            -v "$PWD/dist:/dist" \
            -e PLUGINS="$PINNED" -e GOARCH -e GOOS=linux -e CGO_ENABLED=0 \
            "caddy:${VERSION}-builder" \
            sh -c 'args=""; for p in $PLUGINS; do args="$args --with $p"; done; xcaddy build $args --output /dist/caddy'
          # docker run 默认以 root 写入，挂载出来的 dist/caddy 属主是 root，
          # 而 runner 不是 root —— 不先接管属主，下面的 chmod 会 Permission denied。
          sudo chown "$(id -u):$(id -g)" dist/caddy
          chmod +x dist/caddy
          file dist/caddy

      - name: 打包并生成校验和
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eux
          name="caddy_${VERSION}_linux_${{ matrix.goarch }}"
          tar -C dist -czf "${name}.tar.gz" caddy
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      # 把镜像也归档一份放进 Release。出国带宽只有 ~0.55 MB/s，这条路的下载速度
      # 不比直接 pull 快，价值在于「下载成文件后可以离线分发」（scp 到任意机器、
      # 无外网环境也能用），并且和 GHCR 那边互为备份。
      - name: 归档镜像
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eux
          ref="${REGISTRY}/${{ needs.check.outputs.image }}:caddy-${VERSION}"
          name="caddy-image_${VERSION}_linux_${{ matrix.goarch }}"
          # 多架构镜像没法用一个 docker save 打包，所以只拉本架构那一份。
          # save 出来的 tar 里带着原始 RepoTags，load 回去镜像名与 GHCR 一致。
          docker pull --platform "linux/${{ matrix.goarch }}" "$ref"
          docker save "$ref" | gzip -9 > "${name}.tar.gz"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          ls -lh "${name}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: caddy-linux-${{ matrix.goarch }}
          path: |
            caddy_${{ needs.check.outputs.version }}_linux_${{ matrix.goarch }}.tar.gz
            caddy_${{ needs.check.outputs.version }}_linux_${{ matrix.goarch }}.tar.gz.sha256
            caddy-image_${{ needs.check.outputs.version }}_linux_${{ matrix.goarch }}.tar.gz
            caddy-image_${{ needs.check.outputs.version }}_linux_${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

      # Artifacts 必须登录才能下载，而且 90 天就过期；Release 的 Assets
      # 匿名可下、且不过期，所以每次构建都往 Release 里放一份。
      # 每个 Caddy 版本一个 Release（tag 形如 caddy-2.11.7）。标题和说明每次构建都刷新，
      # 所以插件版本变了、说明不会停在首次创建的内容上。
      # 注意这个 tag 不匹配 v*，不会反过来触发本 workflow。
      - name: 发布/更新 caddy-<版本> 的 Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PINNED: ${{ needs.check.outputs.plugins }}
          FP: ${{ needs.check.outputs.fingerprint }}
          IMAGE: ${{ needs.check.outputs.image }}
        run: |
          set -eux
          tag="caddy-${VERSION}"
          plugin_list=$(printf '%s\n' ${PINNED} | sed 's/^/- /')

          notes=$(cat <<EOF
          Caddy **v${VERSION}**，由 GitHub Actions 自动构建。

          #### 携带的插件

          ${plugin_list}

          #### Docker 镜像

          ~~~
          docker pull ghcr.io/${IMAGE}:${tag}
          ~~~

          支持 \`linux/amd64\` 与 \`linux/arm64\`。同一次构建还会额外打上
          \`latest\`（默认分支最新）、\`fp-${FP}\`（构建指纹）、\`sha-<提交>\`（对应提交）等标签。

          #### 离线镜像归档

          拉不动 ghcr.io、或要分发到没有外网的机器时，下载对应架构的这个文件：

          - \`caddy-image_${VERSION}_linux_amd64.tar.gz\`（另有同名 \`.sha256\`）
          - \`caddy-image_${VERSION}_linux_arm64.tar.gz\`（另有同名 \`.sha256\`）

          ~~~
          sha256sum -c caddy-image_${VERSION}_linux_amd64.tar.gz.sha256
          docker load < caddy-image_${VERSION}_linux_amd64.tar.gz
          ~~~

          加载出来的镜像名与 GHCR 上完全一致（\`ghcr.io/${IMAGE}:${tag}\`），
          所以 docker-compose.yml 里的 \`image:\` 不用改。

          #### 静态二进制

          - \`caddy_${VERSION}_linux_amd64.tar.gz\`（另有同名 \`.sha256\`）
          - \`caddy_${VERSION}_linux_arm64.tar.gz\`（另有同名 \`.sha256\`）

          ~~~
          curl -fLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/caddy_${VERSION}_linux_amd64.tar.gz
          sha256sum -c caddy_${VERSION}_linux_amd64.tar.gz.sha256
          tar xzf caddy_${VERSION}_linux_amd64.tar.gz
          sudo install -m 0755 caddy /usr/bin/caddy
          ~~~

          #### 构建信息

          - 构建指纹：\`fp-${FP}\`
          - 构建日志：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 已存在就地更新，不要删 tag
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Caddy ${VERSION}" --notes "$notes"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Caddy ${VERSION}" --notes "$notes"
          fi

          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "caddy_${VERSION}_linux_${{ matrix.goarch }}.tar.gz" \
            "caddy_${VERSION}_linux_${{ matrix.goarch }}.tar.gz.sha256" \
            "caddy-image_${VERSION}_linux_${{ matrix.goarch }}.tar.gz" \
            "caddy-image_${VERSION}_linux_${{ matrix.goarch }}.tar.gz.sha256"

      - name: 如果你自己打了 tag，也附加一份到那个 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -eux
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            "caddy_${VERSION}_linux_${{ matrix.goarch }}.tar.gz" \
            "caddy_${VERSION}_linux_${{ matrix.goarch }}.tar.gz.sha256" \
            "caddy-image_${VERSION}_linux_${{ matrix.goarch }}.tar.gz" \
            "caddy-image_${VERSION}_linux_${{ matrix.goarch }}.tar.gz.sha256"
